spring:
  application:
    name: pos-licoreria

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pos_licoreria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Managua&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${DB_PASSWORD:2212mamapoose}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Managua

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Managua

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

pos:
  normativa:
    edad-minima-alcohol: 18
    horario-habilitado: true
  impuesto:
    tasa-iva: 0.15
  mayorista:
    volumen-minimo-umm: 6
  respaldo:
    directorio: ${BACKUP_DIR:./backups}
    mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
    mysql-path: ${MYSQL_PATH:mysql}
    max-respaldos: 30
    permitir-restaurar: true
  jwt:
    secret: ${JWT_SECRET:cambiar-esta-clave-en-produccion-pos-licoreria-2026}
    expiration-ms: 28800000
    max-intentos-login: 5
    bloqueo-minutos: 15
  # Stripe: desactivado por defecto. Sin claves el POS sigue igual (efectivo / tarjeta manual).
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:usd}

logging:
  level:
    com.licoreria.pos: DEBUG
    org.springframework.security: INFO
